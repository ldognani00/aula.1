<ul>
  <li *ngFor="let disciplina of disciplinas; let isEven = even; let isOdd = odd; let isFirst = first; let isLast = last; let i = index">
    {{ i + 1 }} - {{ disciplina }}
    <span *ngIf="isEven"> (Par)</span>
    <span *ngIf="isOdd"> (Ímpar)</span>
    <span *ngIf="isFirst"> - Primeira</span>
    <span *ngIf="isLast"> - Última</span>
  </li>
</ul>
