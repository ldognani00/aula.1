<div>
    <label>Produto: </label>
    <input type="text" [(ngModel)]="produto" /><br>

    <label>Preço: </label>
    <input type="number" [(ngModel)]="preco"/><br>

    <label>Quantidade: </label>
    <input type="number" [(ngModel)]="quantidade"/>
</div>

<hr>
<p>Produto: {{produto}}</p>
<p>Preço: {{preco | currency: 'BRL'}}</p>
<p>Quantidade: {{quantidade}}</p>
<p>Total: {{preco * quantidade | currency:'BRL'}}</p>
